name: Build and Release

on:
  push:
    branches: [ "Electron", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "Electron", "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Build Application
      run: npm run build

    - name: Package macOS
      if: matrix.os == 'macos-latest'
      run: npx electron-builder --mac --publish never
      shell: bash

    - name: Package Windows
      if: matrix.os == 'windows-latest'
      run: npx electron-builder --win --publish never
      shell: bash

    - name: Upload packaged files
      uses: actions/upload-artifact@v4
      with:
        name: AutoBrowser-${{ matrix.os }}
        path: |
          release/**
          !release/*.blockmap
          !release/latest*.yml
        if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - name: Download packaged files
      uses: actions/download-artifact@v4
      with:
        path: packaged

    - name: Publish Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        RUN_NUMBER: ${{ github.run_number }}
        SHA: ${{ github.sha }}
      run: |
        if [[ "$REF_TYPE" == "tag" ]]; then
          TAG="$REF_NAME"
          TITLE="AutoBrowser $REF_NAME"
        else
          TAG="build-$RUN_NUMBER"
          TITLE="AutoBrowser build $RUN_NUMBER"
        fi

        mapfile -t FILES < <(find packaged -type f | sort)

        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" "${FILES[@]}" --clobber
        else
          gh release create "$TAG" "${FILES[@]}" \
            --title "$TITLE" \
            --notes "Automated build from commit $SHA" \
            --target "$SHA"
        fi
      shell: bash
