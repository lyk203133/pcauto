name: Build pcauto

on:
  push:
    tags:
      - 'v*'          # 推 tag（如 v2.1.0）時自動觸發
  workflow_dispatch:  # 也可在 GitHub 頁面手動觸發

jobs:
  # ── Windows 打包 ─────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\pcauto
          Copy-Item target\x86_64-pc-windows-msvc\release\pcauto.exe dist\pcauto\
          Copy-Item config.json.example dist\pcauto\config.json
          Compress-Archive -Path dist\pcauto -DestinationPath pcauto-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcauto-windows
          path: pcauto-windows-x64.zip
          retention-days: 30

  # ── macOS 打包（Apple Silicon）────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Build release
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/pcauto dist/
          cp config.json.example dist/config.json
          cd dist && zip -r ../pcauto-macos-arm64.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcauto-macos
          path: pcauto-macos-arm64.zip
          retention-days: 30

  # ── 發布 Release（推 tag 時才執行）──────────────────────
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pcauto-windows/pcauto-windows-x64.zip
            pcauto-macos/pcauto-macos-arm64.zip
          generate_release_notes: true
