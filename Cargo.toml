[package]
name = "pcauto"
version = "2.0.0"
edition = "2021"
authors = ["pcauto"]
description = "PCauto — Browser automation tool"

[[bin]]
name = "pcauto"
path = "src/main.rs"

[dependencies]
# GUI
eframe = { version = "0.29", features = ["default_fonts"] }
egui = "0.29"

# HTTP
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }

# Browser automation (CDP-based)
chromiumoxide = { version = "0.5", features = ["tokio-runtime"] }
futures = "0.3"

# HMAC / crypto
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Regex (template rendering)
regex = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
dirs = "5"
anyhow = "1"
once_cell = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[profile.dev]
opt-level = 0
